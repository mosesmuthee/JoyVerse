<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Infinite Gallery 💜</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #0a0608; color: #f5ede6; overflow-x: hidden; }
        .swiper-main { width: 100%; height: 550px; padding-top: 50px; padding-bottom: 50px; }
        .swiper-main .swiper-slide {
            background-position: center; background-size: contain; background-repeat: no-repeat;
            width: 350px; height: 480px; border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .swiper-thumbs { width: 100%; height: 120px; padding: 10px 0; margin-top: 20px; }
        .swiper-thumbs .swiper-slide {
            width: 100px; height: 100px; border-radius: 10px; overflow: hidden;
            cursor: pointer; opacity: 0.4; transition: all 0.3s ease;
        }
        .swiper-thumbs .swiper-slide-thumb-active { opacity: 1; border: 2px solid #7b5ea7; }
        .swiper-thumbs .swiper-slide img { width: 100%; height: 100%; object-fit: contain; background: #000; }
    </style>
</head>
<body>
    <main class="container py-20 text-center">
        <h1 class="display-3 mb-2 fw-bold" style="font-family: 'Playfair Display', serif;">Our Infinite Gallery 💜</h1>
        
        <div class="swiper swiper-main">
            <div class="swiper-wrapper" id="mainSwiperWrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>

        <div class="swiper swiper-thumbs">
            <div class="swiper-wrapper" id="thumbsSwiperWrapper"></div>
        </div>

        <button onclick="navigateTo('friend-memories.html')" class="btn-glow mt-20 px-10 py-4 fs-3 rounded-full bg-white text-black border-none">
            Remember the funny stuff →
        </button>
    </main>

      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

        finalPhotos.forEach(photo => {

            mainWrapper.innerHTML += `<div class="swiper-slide" style="background-image:url('${path}')"></div>`;

        new Swiper('.swiper-main', {
            loop: true, thumbs: { swiper: swiperThumbs },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            autoplay: { delay: 3000 }

</body>
</html>
