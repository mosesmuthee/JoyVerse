<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would you like to continue? 🎀</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #8B1A2F, #D4A017, #7B5EA7, #E8A0BF);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            color: #ffffff;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }
        @keyframes gradientShift {
            0%   { background-position: 0%   50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0%   50%; }
        }

        #floatCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        #particles-js {
            position: fixed; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        main { position: relative; z-index: 2; }

        .rounded-full { border-radius: 9999px !important; }
        .border-none  { border: none !important; }

        #yesBtn {
            background: #ffffff; color: #000000;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.3s ease;
            position: relative;
        }
        #yesBtn.glowing { animation: yesPulse 1.6s ease-in-out infinite; }
        @keyframes yesPulse {
            0%   { box-shadow: 0 0 12px 4px rgba(212,160,23,0.5),  0 0 28px 10px rgba(232,160,191,0.35); }
            50%  { box-shadow: 0 0 28px 12px rgba(212,160,23,0.85),0 0 55px 22px rgba(232,160,191,0.6);  }
            100% { box-shadow: 0 0 12px 4px rgba(212,160,23,0.5),  0 0 28px 10px rgba(232,160,191,0.35); }
        }

        #noBtn {
            background-color: #4b5563; color: #ffffff;
            cursor: pointer;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        #noBtn:hover { background-color: #374151; }

        /* Explosion shockwave ring */
        .shockwave {
            position: fixed;
            border-radius: 50%;
            border: 3px solid rgba(255,180,60,0.9);
            pointer-events: none;
            z-index: 999;
            transform: scale(0);
            opacity: 1;
            animation: shockwaveExpand 0.6s ease-out forwards;
        }
        @keyframes shockwaveExpand {
            0%   { transform: scale(0);   opacity: 0.9; }
            100% { transform: scale(8);   opacity: 0;   }
        }

        /* Flash overlay */
        #flashOverlay {
            position: fixed; inset: 0;
            background: rgba(255,220,100,0);
            pointer-events: none;
            z-index: 998;
            transition: background 0.08s ease;
        }
        #flashOverlay.flash { background: rgba(255,220,100,0.45); }
    </style>
</head>
<body>
    <canvas id="floatCanvas"></canvas>
    <div id="particles-js"></div>
    <div id="flashOverlay"></div>

    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center text-center">
        <h1 id="heading" class="display-3 fw-bold mb-4">Something very special is waiting for you 🎀</h1>
        <p class="fs-4 mb-5">Would you like to continue?</p>

        <div class="d-flex gap-4 align-items-center flex-wrap justify-content-center">
            <button id="yesBtn" class="btn-glow px-5 py-3 fs-3 rounded-full border-none">YES ❤️</button>
            <button id="noBtn"  class="px-5 py-3 fs-3 rounded-full border-none">No thanks 😭</button>
        </div>
    </main>

    <audio id="noSound" preload="auto">
        <source src="YOUR_AUDIO_FILE.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/global.js"></script>

    <script>
        function safeNavigateTo(path) {
            if (typeof navigateTo === 'function') navigateTo(path);
            else window.location.href = path;
        }
        function safeLaunchHearts(id) {
            if (typeof launchHearts === 'function') launchHearts(id);
        }

        /* ═══════════════════════════════════════
           BACKGROUND — orbiting planets + shooting stars
           ═══════════════════════════════════════ */
        (function () {
            const canvas = document.getElementById('floatCanvas');
            const ctx    = canvas.getContext('2d');
            let W, H;

            /* ── Shooting stars ── */
            const stars = [];
            for (let i = 0; i < 18; i++) stars.push(makeStar(true));

            function makeStar(scattered) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3.5 + 1.5;
                return {
                    x:      Math.random() * (window.innerWidth  || 800),
                    y:      scattered ? Math.random() * (window.innerHeight || 600) : -10,
                    vx:     Math.cos(angle) * speed * 0.3,
                    vy:     speed,
                    len:    Math.random() * 55 + 20,
                    alpha:  Math.random() * 0.55 + 0.2,
                    width:  Math.random() * 1.8 + 0.4,
                    hue:    Math.random() * 60 + 20
                };
            }

            /* ── Orbiting planet blobs ── */
            const BLOBS = [
                { cx: 0.15, cy: 0.25, r: 38, color: 'rgba(139,26,47,0.18)',  orbitR: 22, orbitSpeed: 0.007,  angle: 0    },
                { cx: 0.82, cy: 0.15, r: 55, color: 'rgba(123,94,167,0.15)', orbitR: 30, orbitSpeed: 0.005,  angle: 1.2  },
                { cx: 0.72, cy: 0.78, r: 44, color: 'rgba(212,160,23,0.14)', orbitR: 18, orbitSpeed: 0.009,  angle: 2.5  },
                { cx: 0.1,  cy: 0.7,  r: 32, color: 'rgba(232,160,191,0.16)',orbitR: 25, orbitSpeed: 0.006,  angle: 4.0  },
                { cx: 0.5,  cy: 0.05, r: 28, color: 'rgba(200,100,80,0.12)', orbitR: 15, orbitSpeed: 0.011,  angle: 0.8  },
            ];

            /* ── Floating emoji particles ── */
            const EMOJIS = ['💕','💗','✨','🌸','💫','🌟','🌺','💖','🌼','🩷','💞','🌹'];
            const floaters = Array.from({ length: 32 }, () => makeFloater(true));

            function makeFloater(scattered) {
                return {
                    emoji:       EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
                    x:           Math.random() * (W || window.innerWidth),
                    y:           scattered
                                     ? Math.random() * (H || window.innerHeight)
                                     : (H || window.innerHeight) + 30,
                    size:        Math.random() * 18 + 10,
                    speedY:      Math.random() * 0.5 + 0.18,
                    speedX:      (Math.random() - 0.5) * 0.3,
                    wobble:      Math.random() * Math.PI * 2,
                    wobbleSpeed: Math.random() * 0.02 + 0.006,
                    alpha:       Math.random() * 0.4 + 0.15,
                    rot:         Math.random() * Math.PI * 2,
                    rotSpeed:    (Math.random() - 0.5) * 0.014
                };
            }

            function resize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function loop() {
                ctx.clearRect(0, 0, W, H);

                /* Draw planet blobs */
                BLOBS.forEach(b => {
                    b.angle += b.orbitSpeed;
                    const bx = b.cx * W + Math.cos(b.angle) * b.orbitR;
                    const by = b.cy * H + Math.sin(b.angle) * b.orbitR;
                    const g = ctx.createRadialGradient(bx, by, 0, bx, by, b.r);
                    g.addColorStop(0, b.color.replace('0.', '0.').replace(/[\d.]+\)$/, m => (parseFloat(m)*2.2).toFixed(2)+')'));
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.beginPath();
                    ctx.arc(bx, by, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = g;
                    ctx.fill();
                });

                /* Draw shooting stars */
                stars.forEach((s, i) => {
                    ctx.save();
                    ctx.globalAlpha = s.alpha;
                    const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * s.len / s.vy, s.y - s.len);
                    grad.addColorStop(0, `hsla(${s.hue},100%,90%,1)`);
                    grad.addColorStop(1, `hsla(${s.hue},100%,90%,0)`);
                    ctx.strokeStyle = grad;
                    ctx.lineWidth   = s.width;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x - s.vx * (s.len / s.vy), s.y - s.len);
                    ctx.stroke();
                    ctx.restore();

                    s.x += s.vx; s.y += s.vy;
                    if (s.y > H + 20) stars[i] = makeStar(false);
                });

                /* Draw floating emojis */
                floaters.forEach((p, i) => {
                    p.wobble += p.wobbleSpeed;
                    p.rot    += p.rotSpeed;
                    p.x += p.speedX + Math.sin(p.wobble) * 0.45;
                    p.y -= p.speedY;
                    if (p.y < -30) { floaters[i] = makeFloater(false); }
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.font = `${p.size}px serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.emoji, 0, 0);
                    ctx.restore();
                });

                requestAnimationFrame(loop);
            }

            window.addEventListener('resize', resize);
            resize(); loop();
        })();

        /* ── Page load ── */
        window.addEventListener('load', () => {
            safeLaunchHearts('particles-js');
            if (typeof gsap !== 'undefined') {
                gsap.from('#heading', { opacity: 0, y: 30, duration: 1, delay: 0.3 });
            }
        });

        /* ── Button state ── */
        let noClickCount  = 0;
        let yesScale      = 1.0;
        let noScale       = 1.0;
        let glowActivated = false;

        const yesBtn      = document.getElementById('yesBtn');
        const noBtn       = document.getElementById('noBtn');
        const noSound     = document.getElementById('noSound');
        const flashOverlay= document.getElementById('flashOverlay');

        const noMessages = [
            { title: "Nice try Joy 😂",            text: "That button doesn't work here." },
            { title: "You literally cannot 😤",    text: "Watch the YES button grow. That's our future." },
            { title: "Wrong button, My Love 💀",   text: "The other one. The big glowing one." },
            { title: "Try. The. Other. One. 👀",   text: "It's right there." },
            { title: "NO IS NOT AN OPTION 🚨",     text: "This is not a negotiation." },
            { title: "The YES button misses you.", text: "It's been waiting this whole time 😭" },
            { title: "Why Though Honestly.",       text: "Weeeeeeeeelllllll, seems there is no other option." },
            { title: "NO has left the chat. 💅",   text: null }
        ];

        function playNoSound() {
            if (!noSound || !noSound.src || noSound.src.endsWith('YOUR_AUDIO_FILE.mp3')) return;
            noSound.currentTime = 0;
            noSound.play().catch(() => {});
        }

        /* ── EXPLOSION when NO disappears ── */
        function explodeNoBtn() {
            const rect = noBtn.getBoundingClientRect();
            const cx   = rect.left + rect.width  / 2;
            const cy   = rect.top  + rect.height / 2;

            /* 1. Screen flash */
            flashOverlay.classList.add('flash');
            setTimeout(() => flashOverlay.classList.remove('flash'), 160);

            /* 2. Shockwave rings — 3 staggered */
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const ring = document.createElement('div');
                    ring.className = 'shockwave';
                    const size = 60;
                    ring.style.cssText = `
                        width:${size}px; height:${size}px;
                        left:${cx - size/2}px; top:${cy - size/2}px;
                        border-color: ${['rgba(255,180,60,0.9)','rgba(255,120,80,0.7)','rgba(255,220,150,0.5)'][i]};
                        animation-duration: ${0.5 + i * 0.15}s;
                    `;
                    document.body.appendChild(ring);
                    setTimeout(() => ring.remove(), 900);
                }, i * 80);
            }

            /* 3. Burst confetti from button position */
            const origin = { x: cx / window.innerWidth, y: cy / window.innerHeight };
            confetti({ particleCount: 55, spread: 360, startVelocity: 22, gravity: 0.6,
                colors: ['#ff6b35','#f7931e','#ffcd3c','#ff4757','#ffd700'], origin, scalar: 0.85 });
            setTimeout(() => {
                confetti({ particleCount: 30, spread: 360, startVelocity: 14, gravity: 0.5,
                    colors: ['#ff9ff3','#feca57','#ff6b6b','#48dbfb'], origin, scalar: 0.7 });
            }, 120);

            /* 4. Shake screen */
            if (typeof gsap !== 'undefined') {
                gsap.to('main', { x: -8, duration: 0.05, yoyo: true, repeat: 7, ease: 'none',
                    onComplete: () => gsap.set('main', { x: 0 }) });
            }

            /* 5. Emoji burst — fling emojis from button position */
            const BURST = ['💥','🔥','✨','💫','⚡','🌟','💢'];
            for (let i = 0; i < 10; i++) {
                const el = document.createElement('span');
                el.textContent = BURST[Math.floor(Math.random() * BURST.length)];
                const angle  = (Math.PI * 2 / 10) * i;
                const dist   = 80 + Math.random() * 60;
                el.style.cssText = `
                    position:fixed; left:${cx}px; top:${cy}px;
                    font-size:${20 + Math.random()*16}px;
                    pointer-events:none; z-index:1000;
                    transition: transform 0.55s ease-out, opacity 0.55s ease-out;
                    transform: translate(-50%,-50%);
                    opacity:1;
                `;
                document.body.appendChild(el);
                requestAnimationFrame(() => {
                    el.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
                    el.style.opacity   = '0';
                });
                setTimeout(() => el.remove(), 600);
            }
        }

        noBtn.addEventListener('click', () => {
            noClickCount++;

            noScale  = Math.max(0.05, noScale  - 0.15);
            yesScale = Math.min(3.0,  yesScale + 0.22);
            noBtn.style.transform  = `scale(${noScale})`;
            yesBtn.style.transform = `scale(${yesScale})`;

            if (!glowActivated) {
                glowActivated = true;
                yesBtn.classList.add('glowing');
            }

            playNoSound();

            const msg = noMessages[Math.min(noClickCount - 1, noMessages.length - 1)];
            Swal.fire({
                toast: true, position: 'top-end', icon: 'warning',
                title: msg.title, text: msg.text || undefined,
                showConfirmButton: false, timer: 2500
            });

            if (noClickCount >= 8) {
                /* Explode THEN hide */
                explodeNoBtn();
                setTimeout(() => {
                    noBtn.style.display = 'none';
                    setTimeout(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'There is no NO here 😂',
                            html: 'The YES button has been waiting patiently.<br>It is time.',
                            confirmButtonText: 'Fine. YES. ❤️',
                            confirmButtonColor: '#D4A017',
                            allowOutsideClick: false,
                            allowEscapeKey: false
                        }).then(() => safeNavigateTo('choose.html'));
                    }, 500);
                }, 300);
            }
        });

        yesBtn.addEventListener('click', () => safeNavigateTo('choose.html'));
    </script>
</body>
</html>
