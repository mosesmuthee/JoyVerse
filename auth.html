<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check 🔐</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 60% 40%, #2a1a2e 0%, #0d0810 55%, #0a0608 100%);
            color: #f5ede6;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
        }

        #bgCanvas, #jbCanvas {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #bgCanvas { z-index: 0; }
        #jbCanvas  { z-index: 1; }
        main       { position: relative; z-index: 2; }

        /* Card */
        #authCard {
            background: rgba(30, 14, 22, 0.75);
            border: 1px solid rgba(210, 170, 140, 0.2);
            border-radius: 1.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 0 18px 4px  rgba(200,155,120,0.18),
                0 0 50px 14px rgba(180,120,100,0.12),
                0 0 95px 30px rgba(150,90,80,0.08);
            animation: cardBreath 3.5s ease-in-out infinite;
        }
        @keyframes cardBreath {
            0%,100% { box-shadow: 0 0 18px 4px rgba(200,155,120,0.18), 0 0 50px 14px rgba(180,120,100,0.12), 0 0 95px 30px rgba(150,90,80,0.08); }
            50%      { box-shadow: 0 0 30px 9px rgba(210,165,130,0.32), 0 0 70px 22px rgba(190,130,110,0.22), 0 0 125px 44px rgba(160,100,88,0.14); }
        }

        /* Intro text — softer italic */
        #introText {
            font-family: 'Dancing Script', cursive;
            font-size: 1.15rem;
            color: rgba(230, 200, 175, 0.75);
            letter-spacing: 0.02em;
            min-height: 32px;
            line-height: 1.6;
        }

        /* Question heading — bold, distinct */
        #questionText {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #f0e0d0;
            line-height: 1.3;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            min-height: 60px;
        }
        #questionText.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Divider */
        .card-divider {
            border: none;
            border-top: 1px solid rgba(210,170,140,0.15);
            margin: 1.4rem 0 1.1rem;
        }

        /* Answer options — stacked quiz-show rows */
        .answer-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 0.85rem;
            border: 1px solid rgba(210,170,140,0.14);
            background: rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.22s ease;
            opacity: 0;
            transform: translateX(-14px);
        }
        .answer-row.visible {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.45s ease, transform 0.45s ease, background 0.25s ease, border-color 0.25s ease;
        }
        .answer-row:hover {
            background: rgba(200,150,120,0.13);
            border-color: rgba(210,170,140,0.4);
            transform: translateX(4px);
        }
        /* Option D — slightly highlighted */
        .answer-row[data-value="D"] {
            border-color: rgba(212,160,100,0.28);
            background: rgba(212,160,100,0.06);
        }
        .answer-row[data-value="D"]:hover {
            background: rgba(212,160,100,0.15);
            border-color: rgba(212,160,100,0.5);
        }

        /* Letter badge */
        .answer-badge {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(210,160,120,0.15);
            border: 1px solid rgba(210,160,120,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #d4a078;
        }

        /* Answer text */
        .answer-text {
            flex: 1;
            text-align: left;
            font-size: 0.96rem;
            color: #efe0d0;
            line-height: 1.45;
        }

        /* Arrow */
        .answer-arrow {
            font-size: 0.85rem;
            color: rgba(210,160,120,0.4);
            flex-shrink: 0;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .answer-row:hover .answer-arrow {
            color: rgba(210,160,120,0.9);
            transform: translateX(3px);
        }

        /* Answers wrapper spacing */
        #answersWrap { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="jbCanvas"></canvas>

    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div id="authCard" class="p-5 text-center" style="max-width: 520px; width: 100%;">

            <p style="font-family:'Dancing Script',cursive; font-size:0.88rem; color:rgba(210,170,140,0.5); letter-spacing:0.14em; margin-bottom:1.2rem; text-transform: uppercase;">
                Security Check 🔐
            </p>

            <!-- Soft intro line — types first -->
            <div id="introText"></div>

            <!-- Bold question — fades in after intro -->
            <div id="questionText" class="mt-3">Who does Moses love?</div>

            <hr class="card-divider">

            <!-- Stacked answer rows — slide in after question -->
            <div id="answersWrap">
                <div class="answer-row" data-value="A">
                    <div class="answer-badge">A</div>
                    <div class="answer-text">His Wi-Fi password — he treats it like a national secret</div>
                    <span class="answer-arrow">→</span>
                </div>
                <div class="answer-row" data-value="B">
                    <div class="answer-badge">B</div>
                    <div class="answer-text">Sleep. Deeply, passionately, religiously.</div>
                    <span class="answer-arrow">→</span>
                </div>
                <div class="answer-row" data-value="C">
                    <div class="answer-badge">C</div>
                    <div class="answer-text">That one playlist he refuses to share with anyone</div>
                    <span class="answer-arrow">→</span>
                </div>
                <div class="answer-row" data-value="D" style="margin-top: 4px;">
                    <div class="answer-badge" style="background:rgba(212,160,100,0.2); border-color:rgba(212,160,100,0.5); color:#e8b88a;">D</div>
                    <div class="answer-text" style="color:#f5e4d2;">Joy — all roads lead to Joy. Always. Embarrassingly. Joy. 🌹</div>
                    <span class="answer-arrow" style="color:rgba(230,180,130,0.5);">→</span>
                </div>
            </div>

        </div>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/global.js"></script>

    <script>
        /* ── Floating flowers & hearts ── */
        (function () {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            const EMOJIS = ['🌸','🌺','🌹','🌷','💐','💕','💗','💖','💓','🩷','🌼','💞'];
            let W, H, pts;
            function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
            function make() {
                return {
                    x: Math.random() * (W || window.innerWidth),
                    y: Math.random() * (H || window.innerHeight),
                    emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
                    size: Math.random() * 18 + 10,
                    alpha: Math.random() * 0.38 + 0.1,
                    speedY: Math.random() * 0.42 + 0.14,
                    speedX: (Math.random() - 0.5) * 0.28,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: Math.random() * 0.016 + 0.006,
                    drift: Math.random() * 0.55 + 0.2,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.012
                };
            }
            function init() { resize(); pts = Array.from({ length: 52 }, make); pts.forEach(p => { p.y = Math.random() * H; }); }
            function loop() {
                ctx.clearRect(0, 0, W, H);
                pts.forEach(p => {
                    p.wobble += p.wobbleSpeed;
                    p.rot    += p.rotSpeed;
                    p.x += p.speedX + Math.sin(p.wobble) * p.drift;
                    p.y -= p.speedY;
                    if (p.y < -30) { Object.assign(p, make()); p.y = H + 20; p.x = Math.random() * W; }
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.font = `${p.size}px serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.emoji, 0, 0);
                    ctx.restore();
                });
                requestAnimationFrame(loop);
            }
            window.addEventListener('resize', resize);
            init(); loop();
        })();

        /* ── JB watermark ── */
        (function () {
            const canvas = document.getElementById('jbCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const instances = [];
            function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
            function makeJB(forceY) {
                const size = Math.random() * 90 + 60;
                return {
                    x: Math.random() * (W || window.innerWidth),
                    y: forceY !== undefined ? forceY : Math.random() * (H || window.innerHeight),
                    size, alpha: 0,
                    targetAlpha: Math.random() * 0.065 + 0.02,
                    speedY: Math.random() * 0.16 + 0.05,
                    speedX: (Math.random() - 0.5) * 0.1,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.003,
                    fadeIn: true
                };
            }
            function init() { resize(); for (let i = 0; i < 7; i++) instances.push(makeJB()); }
            function loop() {
                ctx.clearRect(0, 0, W, H);
                instances.forEach((j, i) => {
                    j.alpha = j.fadeIn
                        ? Math.min(j.alpha + 0.0008, j.targetAlpha)
                        : Math.max(j.alpha - 0.0005, 0);
                    if (j.alpha >= j.targetAlpha) j.fadeIn = false;
                    j.x += j.speedX; j.y -= j.speedY; j.rot += j.rotSpeed;
                    if (j.alpha <= 0 || j.y < -j.size * 2) { instances[i] = makeJB(H + j.size); return; }
                    ctx.save();
                    ctx.globalAlpha = j.alpha;
                    ctx.translate(j.x, j.y);
                    ctx.rotate(j.rot);
                    ctx.font = `700 ${j.size}px 'Playfair Display', serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#d4a07a';
                    ctx.shadowColor = '#c8845a';
                    ctx.shadowBlur  = 22;
                    ctx.fillText('JB', 0, 0);
                    ctx.shadowBlur  = 9;
                    ctx.fillText('JB', 0, 0);
                    ctx.shadowBlur  = 0;
                    ctx.restore();
                });
                requestAnimationFrame(loop);
            }
            window.addEventListener('resize', resize);
            init(); loop();
        })();

        /* ── Sequence: intro types → question fades → answers slide in ── */
        window.addEventListener('load', () => {
            if (typeof launchHearts === 'function') launchHearts('particles-js');

            if (typeof gsap !== 'undefined') {
                gsap.from('#authCard', { opacity: 0, y: 40, duration: 1, delay: 0.2, ease: 'power3.out' });
            }

            /* Step 1 — type the soft intro */
            new Typed('#introText', {
                strings: ["Before you go any further... a little security check. 🔐"],
                typeSpeed: 38,
                showCursor: true,
                cursorChar: '|',
                onComplete: () => {
                    document.querySelector('.typed-cursor') && (document.querySelector('.typed-cursor').style.opacity = '0');

                    /* Step 2 — reveal the bold question */
                    setTimeout(() => {
                        document.getElementById('questionText').classList.add('visible');

                        /* Step 3 — stagger the answer rows in */
                        const rows = document.querySelectorAll('.answer-row');
                        rows.forEach((row, i) => {
                            setTimeout(() => row.classList.add('visible'), 500 + i * 130);
                        });
                    }, 400);
                }
            });
        });

        /* ── Answer logic ── */
        const authCard = document.getElementById('authCard');

        const wrongMessages = {
            A: { title: "His Wi-Fi? 😭",    text: "Bold guess. Try the other one." },
            B: { title: "Sleep?! 💀",         text: "Moses sleeps ON sleep. Keep thinking." },
            C: { title: "A playlist? 🎵",     text: "Warm... but not quite. One more try." }
        };

        document.querySelectorAll('.answer-row').forEach(row => {
            row.addEventListener('click', () => {
                const val = row.dataset.value;
                if (val === 'D') { handleCorrect(); }
                else { handleWrong(val); }
            });
        });

        function handleWrong(val) {
            const msg = wrongMessages[val] || { title: 'Hmm 👀', text: 'Look more carefully.' };
            authCard.classList.add('animate__animated', 'animate__shakeX');
            Swal.fire({
                toast: true, position: 'top', icon: 'error',
                title: msg.title, text: msg.text,
                showConfirmButton: false, timer: 2500
            });
            setTimeout(() => authCard.classList.remove('animate__animated', 'animate__shakeX'), 900);
        }

        function handleCorrect() {
            const fire = (opts) => confetti(Object.assign({
                particleCount: 60, spread: 80,
                colors: ['#D4A017','#E8A0BF','#8B1A2F','#f5d9c2','#c4887a'],
                origin: { y: 0.55 }
            }, opts));
            fire({ angle: 60,  origin: { x: 0.1, y: 0.6 } });
            fire({ angle: 120, origin: { x: 0.9, y: 0.6 } });
            setTimeout(() => fire({ angle: 90, particleCount: 80 }), 350);

            Swal.fire({
                title: 'Welcome, Joy ❤️',
                html: 'Of course it was you.<br><span style="font-size:0.9rem;opacity:0.9;">It was always going to be you.</span>',
                confirmButtonText: 'Continue →',
                confirmButtonColor: '#D4A017',
                background: 'rgba(26, 13, 20, 0.9) url("images/joy/joy-1.jpg")',
                color: '#fff',
                customClass: {
                    popup: 'welcome-popup'
                },
                didOpen: () => {
                    const popup = Swal.getPopup();
                    popup.style.backgroundSize = 'cover';
                    popup.style.backgroundPosition = 'center';
                    popup.style.backgroundBlendMode = 'overlay';
                    popup.style.textShadow = '0 2px 10px rgba(0,0,0,0.8)';
                }
            }).then(() => {
                if (typeof navigateTo === 'function') navigateTo('continue.html', 0);
                else window.location.href = 'continue.html';
            });
        }
    </script>
</body>
</html>
