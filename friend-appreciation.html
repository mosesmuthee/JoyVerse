<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Appreciate You 💜</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/friend.css">
    <style>
        .appreciation-card { height: 250px; cursor: pointer; perspective: 1000px; }
        .inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s; transform-style: preserve-3d; }
        .appreciation-card:hover .inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .front { background: rgba(255,255,255,0.08); border: 1px solid var(--color-secondary); font-size: 3rem; font-weight: bold; }
        .back { background: var(--color-primary); transform: rotateY(180deg); font-size: 1.2rem; }
    </style>
</head>
<body>
    <main class="container py-20 text-center">
        <h1 class="display-3 mb-10" data-aos="fade-up">Things about you I'll never take for granted. 💜</h1>
        
        <div class="row g-4 mb-20">
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="100"><div class="appreciation-card"><div class="inner"><div class="front">01</div><div class="back">[MOSES FILLS: Appreciation 1]</div></div></div></div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="200"><div class="appreciation-card"><div class="inner"><div class="front">02</div><div class="back">[MOSES FILLS: Appreciation 2]</div></div></div></div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="300"><div class="appreciation-card"><div class="inner"><div class="front">03</div><div class="back">[MOSES FILLS: Appreciation 3]</div></div></div></div>
        </div>

        <button onclick="navigateTo('friend-goals.html')" class="btn-glow px-10 py-4 fs-3 rounded-full bg-white text-black border-none" data-aos="fade-up">
            Our future →
        </button>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/global.js"></script>
    <script src="js/friend.js"></script>
</body>
</html>
