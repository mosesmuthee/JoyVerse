<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story 📖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/friend.css">
    <style>
        .timeline { position: relative; }
        .timeline::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:2px; background: var(--color-secondary); }
        .timeline-entry { position: relative; width: 100%; margin-bottom: 50px; }
        .timeline-content { width: 45%; padding: 30px; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .timeline-content:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .timeline-entry:nth-child(odd) .timeline-content { margin-left: auto; }
        .timeline-dot { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); width: 20px; height: 20px; background: var(--color-secondary); border-radius: 50%; box-shadow: 0 0 15px var(--color-secondary); }
        @media (max-width: 768px) {
            .timeline::before { left: 20px; }
            .timeline-content { width: calc(100% - 60px); margin-left: 60px !important; text-align: left !important; }
            .timeline-dot { left: 20px; }
        }
    </style>
</head>
<body>
    <main class="container py-20 text-center">
        <h1 class="display-3 mb-10" data-aos="fade-up">Our Story, Month by Month. 📖</h1>
        
        <div class="timeline">
            <div class="timeline-entry" data-aos="fade-up">
                <div class="timeline-dot"></div>
                <div class="timeline-content glass-card text-end" onclick="openTimelineEntry('month1')">
                    <h3>Month 1</h3>
                    <p class="fs-4">[MOSES FILLS — e.g. The Beginning 🌱]</p>
                </div>
            </div>
            <!-- More timeline entries -->
        </div>

        <button onclick="navigateTo('friend-gallery.html')" class="btn-glow mt-20 px-10 py-4 fs-3 rounded-full bg-white text-black border-none" data-aos="fade-up">
            See our photos →
        </button>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/friend.js"></script>
</body>
</html>
