<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story Letter 💜</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/friend.css">
    <style>
        body { background: #05070a; }
        .typewriter-paper {
            background-color: #e5e5e5;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            color: #222;
            padding: 80px;
            margin: 50px auto;
            max-width: 800px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 2px;
            transform: rotate(1deg);
            font-family: 'Courier Prime', monospace;
            position: relative;
            border-left: 15px solid #dcdcdc; /* Paper stack look */
        }
        .typewriter-paper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 95%, rgba(0,0,0,0.05));
            pointer-events: none;
        }
        .letter-content p { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; text-indent: 40px; }
        .ink-smudge {
            position: absolute;
            width: 100px; height: 100px;
            background: url('https://img.icons8.com/ios-filled/100/000000/ink-swirl.png') no-repeat center;
            background-size: contain;
            opacity: 0.1;
            bottom: 50px; left: 100px;
            pointer-events: none;
        }
        .voice-note-card { background: rgba(0,0,0,0.1); border-radius: 5px; padding: 15px; margin-top: 40px; border-left: 5px solid #333; }
        
        @media (max-width: 768px) {
            .typewriter-paper { padding: 30px; margin: 20px auto; }
            .letter-content p { font-size: 1rem; text-indent: 20px; }
        }
    </style>
</head>
<body>
    <main class="container py-20">
        <div class="typewriter-paper" data-aos="slide-up" data-aos-duration="1200">
            <div class="mb-10" style="font-size: 1.1rem; border-bottom: 1px solid #999; padding-bottom: 10px;">
                <p>FILE REF: 6-MONTH-REPORT / JOY</p>
                <p>DATE: [Current Date]</p>
            </div>
            
            <div class="letter-content">
                <p data-aos="fade-in" data-aos-delay="500">[MOSES WRITES: Paragraph 1]</p>
                <p data-aos="fade-in" data-aos-delay="700">[MOSES WRITES: Paragraph 2]</p>
                <p data-aos="fade-in" data-aos-delay="900">[MOSES WRITES: Paragraph 3]</p>
                <p data-aos="fade-in" data-aos-delay="1100">[MOSES WRITES: Paragraph 4]</p>
            </div>

            <div class="mt-20" style="font-size: 1.3rem;">
                <p>SIGNING OFF,</p>
                <p style="font-weight: bold; margin-top: 10px;">[Moses's name]</p>
            </div>

            <div class="ink-smudge"></div>

            <div class="voice-note-card" data-aos="fade-in" data-aos-delay="1500">
                <p class="fs-6 mb-2">AUDIO LOG ATTACHED:</p>
                <audio controls class="w-full grayscale">
                    <source src="music/shared/voice-note.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>

        <div class="text-center mt-10">
            <button onclick="navigateTo('friend-finale.html')" class="btn-nude px-10 py-4 fs-3 rounded-full">
                The End →
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/global.js"></script>
</body>
</html>
