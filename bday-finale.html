<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Surprise 🎁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bday.css">
    <style>
        #giftBox { cursor: pointer; text-align: center; font-size: clamp(80px, 40vw, 150px); position: relative; width: clamp(200px, 80vw, 300px); margin: 60px auto; transition: transform 0.3s; }
        #giftBox:hover { transform: scale(1.05); }
        #giftLid { position: absolute; top: -50px; left: 0; width: 100%; z-index: 2; transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #giftBase { position: relative; z-index: 1; }
        #giftBox.open #giftLid { transform: translateY(-120px) rotate(-25deg); opacity: 0; }
        .quiz-card { background: rgba(255,255,255,0.05); border: 1px solid var(--color-secondary); border-radius: 20px; padding: 30px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
        .quiz-card:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }
    </style>
</head>
<body>
    <main class="container py-20 text-center">
        <div id="giftBox" onclick="openGift()">
            <div id="giftLid">🎀</div>
            <div id="giftBase">🎁</div>
            <p class="fs-4 mt-4" id="giftText">Click to open your gift 🎁</p>
        </div>

        <div id="quizSection" class="hidden mt-20" data-aos="fade-up">
            <h2 class="display-4 mb-10">How well do you know yourself? 😂</h2>
            <div class="max-w-2xl mx-auto text-start">
                <p class="fs-3 mb-4">Q: What is your best quality?</p>
                <div class="quiz-card" onclick="Swal.fire('✅ Correct!', 'Obviously. You are everything! ❤️', 'success')">A. Everything</div>
                <div class="quiz-card" onclick="Swal.fire('✅ Correct!', 'Always. No debate. 💅', 'success')">B. Everything</div>
                <div class="quiz-card" onclick="Swal.fire('✅ Correct!', 'Yes. Correct. 💛', 'success')">C. Everything</div>
                <div class="quiz-card" onclick="Swal.fire('✅ Correct!', '100% correct answer! 🏆', 'success')">D. All of the above</div>
            </div>
        </div>

        <div id="closingSection" class="hidden mt-20 py-20">
            <h2 class="display-2 mb-4" style="font-family: var(--font-handwriting);">I'm so glad you exist, Joy.</h2>
            <p class="display-4 mb-10">Happy birthday. 💛</p>
            <button onclick="Swal.fire('🎉', '[MOSES WRITES: Final farewell message]', 'success')" class="btn-glow px-10 py-4 fs-3 rounded-full bg-white text-black border-none">
                Until next year 🎀
            </button>
            <div class="mt-10">
                <a href="choose.html" class="text-white opacity-50 text-decoration-none">← Choose another path</a>
            </div>
        </div>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/bday.js"></script>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (typeof MusicSystem.fadeToOutro === 'function') {
                    MusicSystem.fadeToOutro();
                }
            }, 2000);
        });
    </script>
</body>
</html>
