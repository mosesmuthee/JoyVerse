<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End Part 🎂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #0a0608; color: #f5ede6; overflow: hidden; height: 100vh; }
        .joy-watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20rem; font-family: 'Playfair Display', serif;
            color: rgba(212, 160, 23, 0.08); z-index: 0; pointer-events: none;
            white-space: nowrap; text-shadow: 0 0 50px rgba(212, 160, 23, 0.2);
            animation: pulseJoy 4s ease-in-out infinite;
        }
        @keyframes pulseJoy {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.08; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.15; }
        }
        .content-box { position: relative; z-index: 1; text-align: center; max-width: 800px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="joy-watermark">Joy ❤</div>

    <div class="content-box p-5">
        <h1 class="display-2 fw-bold mb-4" style="font-family:'Dancing Script'; color:#d4a017;">I am so glad you exist, Joy.</h1>
        <p class="fs-2 mb-3">I love you so much and wish you nothing but the best. 💛</p>
        
        <div class="mt-10">
            <button onclick="navigateTo('bday-photo-rain.html')" class="btn-glow px-12 py-3 fs-4 rounded-full bg-white text-black border-none">
                One Last Thing... 🌧️
            </button>
        </div>
    </div>

    <script src="js/global.js"></script>
</body>
</html>
