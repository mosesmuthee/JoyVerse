<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End 💜</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #000; color: #f5ede6; overflow-x: hidden; }
        .content-box { position: relative; z-index: 10; text-align: center; max-width: 800px; padding: 40px; }
        .glow-text { text-shadow: 0 0 20px #7b5ea7; }
    </style>
</head>
<body class="min-vh-100 d-flex flex-column align-items-center justify-content-center">
    <div id="particles-js" style="position: fixed; inset: 0; z-index: 0;"></div>
    
    <main class="content-box">
        <h1 id="endTitle" class="display-1 fw-bold mb-4 glow-text" style="font-family:'Playfair Display';">Here's to us.</h1>
        <h2 class="display-4 mb-5" data-aos="fade-up" data-aos-delay="500">And to forever. 💜</h2>
        <p class="fs-2 mb-10 opacity-75" data-aos="fade-up" data-aos-delay="1000">6 months down, a lifetime to go.</p>

        <div class="mt-20" data-aos="zoom-in" data-aos-delay="1500">
            <button onclick="showFinalSurprise()" class="btn-glow px-12 py-4 fs-3 rounded-full bg-white text-black border-none">
                One Last Thing 💜
            </button>
        </div>

        <div class="mt-10" data-aos="fade-up" data-aos-delay="2000">
            <a href="choose.html" class="text-white opacity-50 text-decoration-none">← Choose another path</a>
        </div>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/global.js"></script>
    <script>
        window.addEventListener('load', () => {
            AOS.init({ duration: 1000, once: true });
            confetti({ particleCount: 200, spread: 160, origin: { y: 0.6 }, colors: ['#7B5EA7', '#E8A0BF'] });
        });

        function showFinalSurprise() {
            Swal.fire({
                title: '6 months. 💜',
                html: "These past six months have been the most incredible journey of my life. Every laugh, every late-night call, and even the chaotic moments have made my world so much brighter. I'm so grateful for you, Joy, and I can't wait for all the months and years still to come.",
                imageUrl: 'images/us/us-1.jpg',
                imageWidth: 250,
                confirmButtonText: '💜 Forever and Always',
                confirmButtonColor: '#7B5EA7',
                allowOutsideClick: false
            }).then(() => {
                const now = new Date();
                const isJune12th = (now.getMonth() === 5 && now.getDate() === 12);
                if (isJune12th) {
                    navigateTo('bday-photo-rain.html');
                } else {
                    navigateTo('choose.html');
                }
            });
        }
    </script>
</body>
</html>
