<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Girl of the Hour ✨</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bday.css">
    <style>
        .swiper { width: 100%; height: 600px; padding-top: 50px; padding-bottom: 50px; }
        .swiper-slide { background-position: center; background-size: cover; width: 300px; height: 450px; border-radius: 20px; }
        @keyframes floatPhoto {
            0%   { transform: translateY(0px) rotate(-2deg); }
            50%  { transform: translateY(-18px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
        .floating-photo { animation: floatPhoto 5s ease-in-out infinite; border-radius: 12px; border: 2px solid var(--color-secondary); }
    </style>
</head>
<body>
    <main class="container py-20 text-center">
        <h1 class="display-3 mb-10" data-aos="fade-up">The girl of the hour. ✨</h1>
        
        <div class="swiper swiper-birthday mb-20" data-aos="zoom-in">
            <div class="swiper-wrapper">
                <div class="swiper-slide" style="background-image:url('images/joy/joy-1.jpg')"></div>
                <div class="swiper-slide" style="background-image:url('images/joy/joy-2.jpg')"></div>
                <div class="swiper-slide" style="background-image:url('images/joy/joy-3.jpg')"></div>
                <div class="swiper-slide" style="background-image:url('images/joy/joy-4.jpg')"></div>
                <div class="swiper-slide" style="background-image:url('images/joy/joy-5.jpg')"></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>

        <h2 class="display-4 mb-5" data-aos="fade-up">Some favorites. 🌟</h2>
        <div class="row g-4 justify-content-center mb-20">
            <div class="col-md-3" data-aos="fade-up" data-aos-delay="100"><img src="images/joy/joy-1.jpg" class="floating-photo w-full shadow-2xl"></div>
            <div class="col-md-3" data-aos="fade-up" data-aos-delay="200"><img src="images/joy/joy-2.jpg" class="floating-photo w-full shadow-2xl" style="animation-delay: 1s;"></div>
            <div class="col-md-3" data-aos="fade-up" data-aos-delay="300"><img src="images/joy/joy-3.jpg" class="floating-photo w-full shadow-2xl" style="animation-delay: 2s;"></div>
        </div>

        <button onclick="navigateTo('bday-messages.html')" class="btn-glow px-10 py-4 fs-3 rounded-full bg-white text-black border-none" data-aos="fade-up">
            Read something beautiful →
        </button>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/global.js"></script>
    <script>
        window.addEventListener('load', () => {
            new Swiper('.swiper-birthday', {
                loop: true,
                autoplay: { delay: 3500, disableOnInteraction: false },
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 40, stretch: 0, depth: 120, modifier: 1, slideShadows: true },
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
            });
        });
    </script>
</body>
</html>
