<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Joy! 🎂</title>
    <link rel="preload" as="image" href="images/joy/joy-bg.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('images/joy/joy-bg.webp');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .countdown-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            min-width: 110px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(-3deg); }
            75% { transform: translateY(-8px) rotate(3deg); }
        }
        .dancing-title {
            animation: dance 3s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(212, 160, 23, 1), 0 0 40px rgba(232, 160, 191, 0.6);
            display: inline-block;
            color: #fff;
        }
        .falling-photo {
            position: absolute;
            width: 100px;
            height: 130px;
            object-fit: cover;
            padding: 5px 5px 15px 5px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid #ddd;
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div id="rainContainer" class="w-full h-full fixed inset-0 z-50"></div>
    
    <section class="hero-section d-flex flex-column justify-content-center align-items-center text-center p-4 relative z-10">
        <div class="glass-panel">
            <h1 id="bdayTitle" class="display-1 fw-bold mb-3 dancing-title" style="font-family:'Playfair Display';">Happy Birthday, Joy. 🎂</h1>
            <p id="bdaySubtitle" class="fs-2 mb-0" style="font-family:'Dancing Script'; color: white;">Today is entirely and completely yours.</p>
        </div>
        <div id="bdayScroll" class="animate-bounce mt-5">
            <span class="fs-1 text-white">↓</span>
        </div>
    </section>

    <section class="py-20 text-center relative overflow-hidden" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
        <div class="container relative z-10">
            <h2 class="display-4 mb-5 text-white" data-aos="fade-up">You have been on this earth for...</h2>
            
            <div class="d-flex justify-content-center gap-3 flex-wrap mb-5" data-aos="zoom-in">
                <div class="countdown-box"><span id="cnt-yrs" class="display-4 fw-bold d-block text-white">0</span>Years</div>
                <div class="countdown-box"><span id="cnt-days" class="display-4 fw-bold d-block text-white">0</span>Days</div>
                <div class="countdown-box"><span id="cnt-hrs" class="display-4 fw-bold d-block text-white">0</span>Hours</div>
                <div class="countdown-box"><span id="cnt-mins" class="display-4 fw-bold d-block text-white">0</span>Mins</div>
                <div class="countdown-box"><span id="cnt-secs" class="display-4 fw-bold d-block text-white">0</span>Secs</div>
            </div>

            <p class="fs-3 mb-10 text-white" data-aos="fade-up" data-aos-delay="200">Every single second was worth it. 💛</p>
            
            <button onclick="navigateTo('bday-gallery.html')" class="btn-glow px-10 py-4 fs-3 rounded-full bg-white text-black border-none" data-aos="fade-up" data-aos-delay="400">
                See your photos →
            </button>
        </div>
    </section>

    <button id="musicToggleBtn" class="music-toggle-btn">🎵</button>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/global.js"></script>

        let lastTime = 0;
        function animateRain(time) {
            if (time - lastTime > 3000) {
                createPhoto();
                lastTime = time;
            }
            requestAnimationFrame(animateRain);
        }

        function createPhoto() {
            const container = document.getElementById('rainContainer');
            const img = document.createElement('img');
            const src = photos[Math.floor(Math.random() * photos.length)];
            img.src = src;
            img.className = 'falling-photo';
            
            const startX = Math.random() * window.innerWidth;
            const duration = 12 + Math.random() * 8;
            
            gsap.set(img, { x: startX, y: -250, opacity: 0, rotation: Math.random() * 20 - 10 });
            container.appendChild(img);
            
            gsap.to(img, {
                y: window.innerHeight + 250,
                opacity: 0.4,
                duration: duration,
                ease: "none",
                onComplete: () => img.remove()
            });
        }

        window.addEventListener('load', () => {
            requestAnimationFrame(animateRain);
            AOS.init({ duration: 1000, once: true });
        });

</html>
