<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Path 🗺️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #0a0608; color: #f5ede6; overflow-x: hidden; }
        .path-card {
            cursor: pointer; border-radius: 1.5rem; transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative; overflow: hidden; min-height: 500px; background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;
            color: white; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .path-card::before { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); transition: background 0.3s ease; z-index: 1; }
        .path-card:hover::before { background: rgba(0, 0, 0, 0.35); }
        .path-card > * { position: relative; z-index: 2; }
        #bdayCard { background-image: url('images/joy/joy-bg.jpg'); box-shadow: 0 0 30px rgba(212, 160, 23, 0.3); }
        #friendCard { background-image: url('images/us/us-bg.jpg'); box-shadow: 0 0 30px rgba(123, 94, 167, 0.3); }
        .path-card:hover { transform: translateY(-10px) scale(1.02); }
        .enter-btn { background: #fff; color: #000; border: none; padding: 12px 35px; border-radius: 50px; font-weight: bold; margin-top: 20px; transition: all 0.3s ease; }
        .enter-btn:hover { background: #d4a017; transform: scale(1.1); }
        
        /* Locked styling */
        .path-card.locked { cursor: not-allowed; filter: grayscale(0.8); }
        .lock-icon { font-size: 3rem; margin-bottom: 1rem; }
        .glow-red { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-20">
        <h1 class="display-3 fw-bold mb-2" data-aos="fade-down" style="font-family:'Playfair Display';">Choose Your Path</h1>
        <p class="fs-4 mb-10 opacity-75" data-aos="fade-up">Where would you like to go, Joy? 🎀</p>

        <div class="row w-100 g-4 max-w-5xl">
            <div class="col-md-6" data-aos="fade-right">
                <div id="bdayCard" class="path-card locked" onclick="checkBdayLock()">
                    <span id="lockIcon" class="lock-icon">🎂</span>
                    <h2 class="display-6 fw-bold mb-3" style="font-family:'Playfair Display';">JB's Birthday</h2>
                    <p id="bdayDesc">A celebration of the most beautiful soul.</p>
                    <div id="countdown" class="glow-red fs-3"></div>
                </div>
            </div>
            <div class="col-md-6" data-aos="fade-left">
                <div id="friendCard" class="path-card" onclick="localStorage.setItem('joyPath', 'friendship'); navigateTo('friend-hero.html')">
                    <span class="display-1 mb-3">💜</span>
                    <h2 class="display-6 fw-bold mb-3">Our 6 Months</h2>
                    <p>A journey through our memories, laughs, and future goals.</p>
                    <button class="enter-btn">Enter Story 💜</button>
                </div>
            </div>
        </div>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="js/global.js"></script>
    <script>
        window.addEventListener('load', () => { AOS.init({ duration: 1000, once: true }); });
        
        const BDAY_DATE = new Date('2026-06-12T00:00:00');

        function checkBdayLock() {
            if (new Date() >= BDAY_DATE) {
                localStorage.setItem('joyPath', 'birthday');
                navigateTo('bday-hero.html');
            } else {
                Swal.fire({
                    title: 'Not yet! 🤫',
                    text: 'you can wait, relaaaax',
                    icon: 'info',
                    background: '#0a0608',
                    color: '#f5ede6'
                });
            }
        }

        function updateCountdown() {
            const now = new Date();
            const diff = BDAY_DATE - now;
            if (diff <= 0) {
                document.getElementById('countdown').textContent = 'UNLOCKED! 🥳';
                document.getElementById('bdayCard').classList.remove('locked');
                return;
            }
            const days = Math.floor(diff / (1000*60*60*24));
            const hrs  = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
            document.getElementById('countdown').textContent = `${days}d ${hrs}h ${mins}m left`;
        }
        
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
