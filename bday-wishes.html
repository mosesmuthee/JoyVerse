<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23 Wishes for You 🎂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #0a0608; color: #f5ede6; overflow-x: hidden; min-height: 100vh; }
        .wishes-container { max-width: 800px; padding: 60px 20px; text-align: center; margin: auto; }
        .wish-card { 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); 
            border: 1px solid rgba(212, 160, 23, 0.3); border-radius: 20px;
            padding: 25px; margin-bottom: 25px; transition: all 0.4s ease;
            position: relative;
        }
        .wish-card:hover { transform: translateY(-5px); background: rgba(212, 160, 23, 0.1); border-color: #d4a017; }
        .wish-number {
            position: absolute; top: -15px; left: 20px;
            background: #d4a017; color: #000; font-weight: bold;
            padding: 2px 12px; border-radius: 50px; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="wishes-container">
            <h1 class="display-3 mb-2" data-aos="fade-down" style="font-family:'Playfair Display'; color:#d4a017;">23 Wishes for Joy 🎂</h1>
            <p class="fs-4 mb-10 opacity-75" data-aos="fade-up">One for every beautiful year of your life.</p>
            
            <div id="wishesGrid">
                <!-- Wishes will be injected here for easier management -->
            </div>
            
            <div class="text-center mt-10" data-aos="fade-up">
                <button onclick="navigateTo('bday-finale.html')" class="btn-glow px-12 py-4 rounded-full bg-white text-black border-none fs-3">One Last Surprise 💖</button>
            </div>
        </div>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/global.js"></script>
    <script>
        const wishes = [
            "May your heart always be filled with the same joy you so naturally give to others. ❤️",
            "May God continue to increase your wisdom, grace, and understanding with every passing year.",
            "May your life remain a testimony of His faithfulness and goodness.",
            "May every room you walk into be brighter because of the light you carry.",
            "May your compassion and kindness never run dry.",
            "May the dreams God has placed in your heart come to life beautifully.",
            "May your faith continue to grow deeper and stronger through every season.",
            "May you always find peace in God's presence, no matter what life brings.",
            "May your smile continue bringing warmth and comfort to those around you.",
            "May every seed you have planted in love, ministry, and friendship bear abundant fruit.",
            "May God surround you with favor wherever you go.",
            "May your strength never fail and your hope never fade.",
            "May you continue inspiring others simply by being yourself.",
            "May this year bring divine opportunities that align perfectly with God's purpose for your life.",
            "May your laughter be frequent, your burdens be light, and your days be filled with peace.",
            "May you always know how precious and treasured you are in God's eyes.",
            "May your gifts and talents continue opening doors and touching lives.",
            "May every challenge you face become a testimony of God's power and faithfulness.",
            "May your love for people continue reflecting Christ in a beautiful way.",
            "May God's protection cover you in every step, every journey, and every decision.",
            "May your birthday mark the beginning of one of the most fruitful years of your life.",
            "May your passion for serving God continue to impact generations.",
            "May you always have reasons to celebrate, smile, and give thanks."
        ];

        window.addEventListener('load', () => {
            const grid = document.getElementById('wishesGrid');
            wishes.forEach((wish, i) => {
                const card = document.createElement('div');
                card.className = 'wish-card';
                card.setAttribute('data-aos', i % 2 === 0 ? 'fade-right' : 'fade-left');
                card.setAttribute('data-aos-delay', (i % 5) * 100);
                card.innerHTML = `
                    <span class="wish-number">Wish #${i + 1}</span>
                    <p class="fs-4 mb-0">${wish}</p>
                `;
                grid.appendChild(card);
            });

            AOS.init({ duration: 1000, once: true });
        });
    </script>
</body>
</html>
