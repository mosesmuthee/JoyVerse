<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter 🎀</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bday.css">
    <style>
        body { background: #0a0a0a; }
        .parchment-container {
            background-color: #f4e1d2;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png'); /* Old paper texture */
            color: #3d2b1f;
            padding: 60px;
            margin: 50px auto;
            max-width: 700px;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.5), inset 0 0 100px rgba(139,69,19,0.2);
            border-radius: 5px;
            transform: rotate(-1deg);
            font-family: 'Caveat', cursive;
            position: relative;
            border: 1px solid #d2b48c;
        }
        .parchment-container::before {
            content: '';
            position: absolute;
            top: 20px; right: 20px;
            width: 80px; height: 80px;
            background: url('https://img.icons8.com/ios-filled/100/8B4513/wax-seal.png') no-repeat center;
            background-size: contain;
            opacity: 0.7;
        }
        .letter-content p { font-size: 1.6rem; margin-bottom: 25px; line-height: 1.4; }
        .voice-note-card { background: rgba(0,0,0,0.05); border-radius: 15px; padding: 20px; margin-top: 40px; border: 1px dashed #8b4513; }
        
        @media (max-width: 768px) {
            .parchment-container { padding: 30px; margin: 20px auto; }
            .letter-content p { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <main class="container py-20">
        <div class="parchment-container" data-aos="zoom-in" data-aos-duration="1500">
            <div class="text-end mb-10" style="font-size: 1.4rem;">
                <p>To My Dearest Joy,</p>
                <p>[Date]</p>
            </div>
            
            <div class="letter-content">
                <p data-aos="fade-up" data-aos-delay="500">[MOSES WRITES: Paragraph 1]</p>
                <p data-aos="fade-up" data-aos-delay="700">[MOSES WRITES: Paragraph 2]</p>
                <p data-aos="fade-up" data-aos-delay="900">[MOSES WRITES: Paragraph 3]</p>
                <p data-aos="fade-up" data-aos-delay="1100">[MOSES WRITES: Paragraph 4]</p>
            </div>

            <div class="text-end mt-10" style="font-size: 1.8rem;">
                <p>Yours truly,</p>
                <p style="font-size: 2.5rem;">[Moses's name]</p>
            </div>

            <div class="voice-note-card" data-aos="fade-up" data-aos-delay="1500">
                <p class="fs-5 mb-3">🎙️ A voice from the heart...</p>
                <audio controls class="w-full">
                    <source src="music/shared/voice-note.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>

        <div class="text-center mt-10">
            <button onclick="navigateTo('bday-finale.html')" class="btn-nude px-10 py-4 fs-3 rounded-full">
                One last surprise →
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/global.js"></script>
</body>
</html>
