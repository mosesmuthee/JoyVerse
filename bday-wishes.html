<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishes for You 🎂</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #0a0608; color: #f5ede6; overflow: hidden; min-height: 100vh; }
        .wishes-container { max-width: 800px; padding: 40px; text-align: center; margin: auto; }
        .wish-card { 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); 
            border: 1px solid rgba(212, 160, 23, 0.3); border-radius: 20px;
            padding: 30px; margin-bottom: 20px; transition: transform 0.3s;
        }
        .wish-card:hover { transform: scale(1.02); background: rgba(212, 160, 23, 0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <main class="container">
        <div class="wishes-container" data-aos="fade-up">
            <h1 class="display-3 mb-5" style="font-family:'Playfair Display'; color:#d4a017;">My Wishes for You 🎂</h1>
            <div class="wish-card" data-aos="fade-right" data-aos-delay="100">
                <p class="fs-4">May your year be as bright as your smile.</p>
            </div>
            <div class="wish-card" data-aos="fade-left" data-aos-delay="200">
                <p class="fs-4">May you achieve every single one of your dreams.</p>
            </div>
            <div class="wish-card" data-aos="fade-right" data-aos-delay="300">
                <p class="fs-4">May you always feel as loved as you are right now.</p>
            </div>
            
            <button onclick="navigateTo('bday-finale.html')" class="btn-glow mt-5 px-12 py-3 rounded-full bg-white text-black border-none fs-4">Finish 💖</button>
        </div>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/global.js"></script>
    <script>
        window.addEventListener('load', () => {
            AOS.init({ duration: 1000, once: true });
        });
    </script>
</body>
</html>
