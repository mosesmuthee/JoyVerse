<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Goals 🗺️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background: #0a0608; color: #f5ede6; overflow-x: hidden; }
        .goal-item { 
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin-bottom: 15px;
            padding: 20px;
            border: 1px solid rgba(123, 94, 167, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .goal-item.checked { border-color: #7b5ea7; background: rgba(123, 94, 167, 0.1); opacity: 0.8; }
        .goal-item.checked .goal-text { text-decoration: line-through; color: #a0a0a0; }
        .goal-check { font-size: 1.5rem; color: #7b5ea7; margin-right: 15px; }
        
        .btn-glow {
            background: white; color: black; border: none; padding: 12px 40px;
            border-radius: 50px; font-weight: bold; transition: all 0.3s ease;
        }
        .btn-glow:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <main class="container py-20 text-center min-vh-100 d-flex flex-column align-items-center">
        <h1 class="display-3 mb-2 fw-bold" data-aos="fade-down" style="font-family:'Playfair Display';">Things for our Future 🗺️</h1>
        <p class="fs-4 mb-10 opacity-75" data-aos="fade-up">A checklist for the next 6 months and beyond.</p>
        
        <div id="goalList" class="w-100 max-w-2xl text-start mb-10">
            <div class="goal-item d-flex align-items-center" onclick="this.classList.toggle('checked')" data-aos="fade-right">
                <span class="goal-check">☐</span>
                <span class="goal-text fs-5">Make a million more memories together. 💜</span>
            </div>
            <div class="goal-item d-flex align-items-center" onclick="this.classList.toggle('checked')" data-aos="fade-left">
                <span class="goal-check">☐</span>
                <span class="goal-text fs-5">Always be each other's safe space. 🏠</span>
            </div>
            <div class="goal-item d-flex align-items-center" onclick="this.classList.toggle('checked')" data-aos="fade-right">
                <span class="goal-check">☐</span>
                <span class="goal-text fs-5">Keep laughing through the chaos. 😂</span>
            </div>
            <div class="goal-item d-flex align-items-center" onclick="this.classList.toggle('checked')" data-aos="fade-left">
                <span class="goal-check">☐</span>
                <span class="goal-text fs-5">Travel to somewhere new. ✈️</span>
            </div>
        </div>

        <div class="w-100 max-w-2xl d-flex gap-2 mb-20" data-aos="fade-up">
            <input id="goalInput" type="text" class="form-control bg-transparent text-white border-secondary p-3" placeholder="Add a goal of your own...">
            <button onclick="addGoal()" class="btn btn-outline-light px-4">Add ❤️</button>
        </div>

        <button onclick="navigateTo('friend-letter.html')" class="btn-glow mt-auto px-10 py-4 fs-3 rounded-full">
            One final letter →
        </button>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/global.js"></script>
    <script>
        window.addEventListener('load', () => { AOS.init({ duration: 1000, once: true }); });
        
        function addGoal() {
            const input = document.getElementById('goalInput');
            const val = input.value.trim();
            if(!val) return;
            
            const list = document.getElementById('goalList');
            const div = document.createElement('div');
            div.className = 'goal-item d-flex align-items-center';
            div.onclick = function() { 
                this.classList.toggle('checked');
                if(this.classList.contains('checked')) confetti({ particleCount: 30, spread: 50 });
            };
            div.innerHTML = `<span class="goal-check">☐</span><span class="goal-text fs-5">${val} (Added ❤️)</span>`;
            list.appendChild(div);
            input.value = '';
            confetti({ particleCount: 50, spread: 70 });
        }
    </script>
</body>
</html>
