<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Through Space... 🌌</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background-color: var(--color-space-bg); overflow-x: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; }
        #nebula {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 4, 4, 0.1), transparent 70%);
            z-index: -2;
        }
    </style>
</head>
<body>
    <div id="nebula"></div>
    <div id="stars-container"></div>
    
    <!-- Planet in the distance -->
    <div id="targetPlanet" class="planet planet-sand" style="width: 200px; height: 200px; top: 60%; left: 80%; opacity: 0.6;"></div>

    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center text-center relative z-10">
        <p id="eyebrow" class="fs-4 mb-2 opacity-0" style="color: var(--color-nude-dark);">Destination: Joy's Universe</p>
        <h1 id="heading" class="display-1 fw-bold mb-4 opacity-0" style="color: var(--color-nude-light);">Hey, Joy. 💛</h1>
        <p id="subtitle" class="fs-3 mb-5 min-vh-10" style="color: var(--color-nude-dark);"></p>
        
        <button id="enterBtn" onclick="warpToAuth()" class="btn-nude px-10 py-4 fs-4 rounded-full opacity-0">
            🚀 Warp to Begin
        </button>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="js/global.js"></script>
    <script>
        // Generate Stars
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            container.appendChild(star);
        }

        window.addEventListener('load', () => {
            gsap.timeline()
                .to('#eyebrow', { opacity: 1, y: -20, duration: 1.5, delay: 0.5 })
                .to('#heading', { opacity: 1, y: -20, duration: 1.5 }, "-=1")
                .to('#targetPlanet', { x: -100, y: -100, scale: 1.5, duration: 20, repeat: -1, yoyo: true, ease: "sine.inOut" }, 0)
                .add(() => {
                    new Typed('#subtitle', {
                        strings: ["We're traveling through the stars to find something just for you.^1000", "Hold on tight."],
                        typeSpeed: 40,
                        showCursor: false,
                        onComplete: () => {
                            gsap.to('#enterBtn', { opacity: 1, y: -10, duration: 1 });
                        }
                    });
                });
        });

        function warpToAuth() {
            gsap.to('body', { scale: 10, opacity: 0, duration: 1.2, ease: "power4.in", onComplete: () => {
                navigateTo('auth.html');
            }});
        }
    </script>
</body>
</html>
