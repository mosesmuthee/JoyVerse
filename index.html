<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Through Space... 🌌</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body { background-color: var(--color-space-bg); overflow-x: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; }
        #nebula {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(74, 4, 4, 0.1), transparent 70%);
            z-index: -2;
        }
        #jb-planets-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
        }
        .jb-planet {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: rgba(212, 160, 23, 0.4);
            text-shadow: 0 0 20px rgba(212, 160, 23, 0.6), 0 0 40px rgba(180, 100, 80, 0.4);
            white-space: nowrap;
            user-select: none;
            animation: float-planet linear infinite;
        }
        @keyframes float-planet {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0.2; }
        }
        .jb-planet.glow-1 {
            text-shadow: 0 0 15px rgba(212, 160, 23, 0.8), 0 0 30px rgba(212, 160, 23, 0.5), 0 0 45px rgba(180, 100, 80, 0.3);
        }
        .jb-planet.glow-2 {
            text-shadow: 0 0 25px rgba(180, 100, 80, 0.7), 0 0 50px rgba(212, 160, 23, 0.4);
        }
        .jb-planet.glow-3 {
            text-shadow: 0 0 20px rgba(232, 160, 191, 0.5), 0 0 35px rgba(180, 100, 80, 0.4);
        }
    </style>
</head>
<body>
    <div id="nebula"></div>
    <div id="stars-container"></div>
    <div id="jb-planets-container"></div>
    
    <!-- Planet in the distance -->
    <div id="targetPlanet" class="planet planet-sand" style="width: 200px; height: 200px; top: 60%; left: 80%; opacity: 0.6;"></div>

    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center text-center relative z-10">
        <p id="eyebrow" class="fs-4 mb-2 opacity-0" style="color: var(--color-nude-dark);">Destination: Joy's Universe</p>
        <h1 id="heading" class="display-1 fw-bold mb-4 opacity-0" style="color: var(--color-nude-light);">Hey, Joy. 💛</h1>
        <p id="subtitle" class="fs-3 mb-5 min-vh-10" style="color: var(--color-nude-dark);"></p>
        
        <button id="enterBtn" onclick="warpToAuth()" class="btn-nude px-10 py-4 fs-4 rounded-full">
            🚀 Warp to Begin
        </button>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="js/global.js"></script>

    <button id="musicToggleBtn"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>
    <script>
        // Generate Stars
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            container.appendChild(star);
        }

        // Generate JB Planets
        const planetsContainer = document.getElementById('jb-planets-container');
        const glowClasses = ['glow-1', 'glow-2', 'glow-3'];
        const sizes = [60, 80, 100, 120, 140, 160];

        for (let i = 0; i < 23; i++) {
            const planet = document.createElement('div');
            planet.className = `jb-planet ${glowClasses[Math.floor(Math.random() * glowClasses.length)]}`;
            planet.textContent = 'JB';

            const size = sizes[Math.floor(Math.random() * sizes.length)];
            const duration = Math.random() * 20 + 15; // 15-35s
            const delay = Math.random() * 5;
            const left = Math.random() * 100;

            planet.style.fontSize = `${size}px`;
            planet.style.left = `${left}vw`;
            planet.style.top = `${Math.random() * 100}vh`;
            planet.style.animationDuration = `${duration}s`;
            planet.style.animationDelay = `${delay}s`;

            planetsContainer.appendChild(planet);
        }


        window.addEventListener('load', () => {
            gsap.timeline()
                .to('#eyebrow', { opacity: 1, y: -20, duration: 1.5, delay: 0.5 })
                .to('#heading', { opacity: 1, y: -20, duration: 1.5 }, "-=1")
                .to('#targetPlanet', { x: -100, y: -100, scale: 1.5, duration: 20, repeat: -1, yoyo: true, ease: "sine.inOut" }, 0)
                .add(() => {
                    new Typed('#subtitle', {
                        strings: ["We're traveling through the stars to find something just for you.^1000", "Hold on tight."],
                        typeSpeed: 40,
                        showCursor: false,
                        onComplete: () => {
                            gsap.to('#enterBtn', { opacity: 1, scale: 1.05, duration: 0.8, ease: "back.out" });
                        }
                    });
                });
        });

        function warpToAuth() {
            if (typeof attemptAutoplay === 'function') attemptAutoplay();
            gsap.to('body', { scale: 10, opacity: 0, duration: 1.2, ease: "power4.in", onComplete: () => {
                // Use delay 0 because GSAP already handled the transition timing
                navigateTo('auth.html', 0);
            }});
        }
    </script>
</body>
</html>
