<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reasons You're Amazing ✨</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bday.css">
    <style>
        .reason-card { background: rgba(0,0,0,0.4); border: 1px solid var(--color-secondary); border-radius: 20px; padding: 30px; position: relative; overflow: hidden; }
        .reason-number { position: absolute; top: 10px; right: 20px; font-size: 3rem; opacity: 0.2; font-weight: bold; color: var(--color-secondary); }
    </style>
</head>
<body>
    <main class="container py-20 text-center">
        <div class="glass-card p-5 mb-20 mx-auto" style="max-width: 800px;">
            <p id="typedMessage" class="fs-2 text-start" style="font-family: var(--font-handwriting);"></p>
            <div id="messageBody" class="text-start mt-4 fs-4 opacity-0">
                <p data-aos="fade-up" data-aos-delay="100">[MOSES WRITES — Paragraph 1]</p>
                <p data-aos="fade-up" data-aos-delay="200">[MOSES WRITES — Paragraph 2]</p>
                <p data-aos="fade-up" data-aos-delay="300">[MOSES WRITES — Paragraph 3]</p>
            </div>
        </div>

        <h2 class="display-3 mb-10" data-aos="fade-up">Let me count the ways... ✨</h2>
        <div class="row g-4 justify-content-center mb-20">
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="100"><div class="reason-card h-100"><span class="reason-number">01</span><p class="fs-4 mt-4">[MOSES FILLS: Reason 1]</p></div></div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="200"><div class="reason-card h-100"><span class="reason-number">02</span><p class="fs-4 mt-4">[MOSES FILLS: Reason 2]</p></div></div>
            <div class="col-md-4" data-aos="zoom-in" data-aos-delay="300"><div class="reason-card h-100"><span class="reason-number">03</span><p class="fs-4 mt-4">[MOSES FILLS: Reason 3]</p></div></div>
        </div>

        <button onclick="navigateTo('bday-memory-wall.html')" class="btn-glow px-10 py-4 fs-3 rounded-full bg-white text-black border-none" data-aos="fade-up">
            There's more →
        </button>
    </main>

    <button id="musicToggleBtn" onclick="MusicSystem.toggle()"
      style="position:fixed; bottom:20px; right:20px; z-index:9999;
             background:rgba(255,255,255,0.1); border:none; border-radius:50%;
             width:48px; height:48px; font-size:20px; cursor:pointer;
             backdrop-filter:blur(10px);">🎵</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="js/global.js"></script>
    <script>
        window.addEventListener('load', () => {
            new Typed('#typedMessage', {
                strings: ["Dear Joy..."],
                typeSpeed: 60,
                showCursor: false,
                onComplete: () => {
                    document.getElementById('messageBody').classList.remove('opacity-0');
                    document.getElementById('messageBody').classList.add('animate__animated', 'animate__fadeIn');
                }
            });
        });
    </script>
</body>
</html>
